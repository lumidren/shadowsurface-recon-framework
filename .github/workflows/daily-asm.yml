name: Daily External Attack Surface Scan (EASM)

on:
  schedule:
    # Run every morning at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Domain to assess'
        required: true
        default: 'example.com'

jobs:
  recon-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily ShadowSurface Recon
        run: |
          python shadowsurface.py -d ${{ github.event.inputs.target_domain || 'example.com' }} --no-ports -o daily-reports

      - name: Upload HTML & SARIF Reports
        uses: actions/upload-artifact@v4
        with:
          name: easm-attack-surface-reports
          path: daily-reports/
